services:
  backend:
    container_name: backend
    build: ./backend
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
    expose:
      - "8000"
    restart: always
    volumes:
      - media_data:/app/media
    networks:
      - shared_net

  celery_worker:
    container_name: celery_worker
    build: ./backend
    command: celery -A core worker -l info --concurrency=4
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
    restart: always
    networks:
      - shared_net

  celery_beat:
    container_name: celery_beat
    build: ./backend
    command: celery -A core beat -l info
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
    restart: always
    networks:
      - shared_net

  frontend:
    container_name: frontend
    build: ./frontend
    ports:
      - "5173:80"
    restart: always
    networks:
      - shared_net

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # maxmemory: evita que Redis consuma toda la RAM del servidor
    # allkeys-lru: desaloja claves menos usadas cuando se llega al límite
    # timeout: cierra conexiones idle después de 5 min (evita conexiones colgadas)
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --timeout 300
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - shared_net

  nginx:
    image: nginx:alpine
    container_name: nginx
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "8080:8080"
      - "4443:443"
    depends_on:
      - backend
      - frontend
    restart: always
    networks:
      - shared_net

volumes:
  redis_data:
  media_data:
    external: true
    name: lms_media_data

networks:
  shared_net:
    driver: bridge